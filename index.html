<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillPatch Academy</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            <div class="logo-box">S</div>
            <h1>SkillPatch Academy</h1>
        </div>

    </header>

    <main>

        <section class="hero">

            <p class="label">
                TRAINING MANAGEMENT PLATFORM
            </p>

            <h2>
                Gerencie certificações.
            </h2>

            <h2 class="highlight">
                Acelere o crescimento.
            </h2>

            <p class="description">
                Plataforma de gestão de treinamentos,
                colaboradores e certificações.
            </p>

        </section>

        <section class="stats">

            <div class="stat-card">

                <h3>Total Employees</h3>

                <p id="employee-count">0</p>

            </div>

        </section>

        <section>

            <h2 class="section-title">
                Employees
            </h2>

            <div id="employees-container" class="employees-grid">

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
